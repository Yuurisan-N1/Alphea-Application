[package]
name = "alphea-bot"
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Alphea Connect mining client"

[[bin]]
name = "alphea-bot"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "io-util", "sync"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
wreq = { version = "0.16", default-features = false, features = ["json", "gzip", "socks", "cookies", "tokio-rt"] }
wreq-util = "0.2"

[profile.release]
opt-level = 2
strip = true

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
